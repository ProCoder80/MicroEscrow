<!-- ====== AUTHENTICATION / LOGIN VIEW COMPONENT ====== -->
<section
  id="auth-view"
  class="max-w-md mx-auto my-6 sm:my-10 px-4 view-transition"
>
  <div
    class="glass rounded-3xl p-6 sm:p-8 border border-white/10 shadow-2xl relative overflow-hidden"
  >
    <!-- Ambient background light effect -->
    <div
      class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute -bottom-24 -right-24 w-48 h-48 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"
    ></div>

    <!-- Header & Logo -->
    <div class="text-center mb-6 relative">
      <div
        class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-gradient-to-br from-indigo-500 to-emerald-500 flex items-center justify-center shadow-xl shadow-indigo-500/25"
      >
        <svg
          class="w-7 h-7 text-white"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"
          />
        </svg>
      </div>
      <h2 class="text-2xl font-black tracking-tight text-white">
        MicroEscrow Access
      </h2>
      <p class="text-xs text-gray-400 mt-1">
        Role-Based Campus Escrow Authorization
      </p>
    </div>

    <!-- Role Switcher Tabs -->
    <div
      class="flex items-center p-1.5 rounded-2xl bg-navy-900/80 border border-white/10 mb-6"
    >
      <button
        id="tab-student"
        onclick="setAuthRole('student')"
        class="flex-1 py-2 rounded-xl text-xs font-bold transition-all duration-200 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-1.5"
      >
        <span>🎓</span>
        <span>Student Login</span>
      </button>
      <button
        id="tab-organizer"
        onclick="setAuthRole('organizer')"
        class="flex-1 py-2 rounded-xl text-xs font-bold transition-all duration-200 text-gray-400 hover:text-white flex items-center justify-center gap-1.5"
      >
        <span>⚙️</span>
        <span>Organizer Login</span>
      </button>
    </div>

    <!-- LOGIN FORM -->
    <form
      id="auth-login-form"
      onsubmit="handleAuthLogin(event)"
      class="space-y-4"
    >
      <div>
        <label
          id="lbl-auth-identifier"
          class="block text-xs text-gray-400 font-semibold mb-1.5"
          for="auth-identifier"
          >College Roll No or Email</label
        >
        <div class="relative">
          <input
            id="auth-identifier"
            type="text"
            placeholder="e.g. 2026CS101 or student@campus.edu"
            required
            class="w-full px-4 py-3 rounded-xl bg-navy-800/90 border border-white/10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/40 transition"
          />
          <div class="absolute right-3 top-3 text-gray-500">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
              />
            </svg>
          </div>
        </div>
      </div>

      <div>
        <label
          class="block text-xs text-gray-400 font-semibold mb-1.5"
          for="auth-password"
          >Password</label
        >
        <div class="relative">
          <input
            id="auth-password"
            type="password"
            placeholder="••••••••"
            required
            class="w-full px-4 py-3 rounded-xl bg-navy-800/90 border border-white/10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/40 transition"
          />
          <div class="absolute right-3 top-3 text-gray-500">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
              />
            </svg>
          </div>
        </div>
      </div>

      <button
        id="btn-auth-submit"
        type="submit"
        class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-500 to-emerald-500 text-white font-bold text-sm shadow-xl shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-2"
      >
        <span>Authorize & Enter</span>
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"
          />
        </svg>
      </button>

      <!-- Quick Demo Access One-Click -->
      <div class="pt-2 border-t border-white/5">
        <p
          class="text-[10px] text-gray-500 uppercase tracking-widest text-center mb-2 font-semibold"
        >
          1-Click Demo Authorization
        </p>
        <button
          id="btn-demo-quick"
          type="button"
          onclick="fillDemoCredentials()"
          class="w-full py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold text-gray-300 transition flex items-center justify-center gap-2"
        >
          <span>⚡</span>
          <span id="txt-demo-quick">Quick Login as Demo Student (Aarav)</span>
        </button>
      </div>

      <!-- Registration Toggle link -->
      <div class="text-center pt-2">
        <button
          type="button"
          onclick="toggleAuthMode('register')"
          class="text-xs text-indigo-400 hover:text-indigo-300 transition"
        >
          New to MicroEscrow?
          <span class="font-bold underline">Create an Account</span>
        </button>
      </div>
    </form>

    <!-- REGISTRATION FORM (Hidden by default) -->
    <form
      id="auth-register-form"
      onsubmit="handleAuthRegister(event)"
      class="hidden space-y-4"
    >
      <div>
        <label
          class="block text-xs text-gray-400 font-semibold mb-1"
          for="reg-name"
          >Full Name *</label
        >
        <input
          id="reg-name"
          type="text"
          placeholder="e.g. Rohan Mehta"
          required
          class="w-full px-4 py-2.5 rounded-xl bg-navy-800/90 border border-white/10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <div>
        <label
          class="block text-xs text-gray-400 font-semibold mb-1"
          for="reg-email"
          >Email Address *</label
        >
        <input
          id="reg-email"
          type="email"
          placeholder="e.g. rohan@campus.edu"
          required
          class="w-full px-4 py-2.5 rounded-xl bg-navy-800/90 border border-white/10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <div class="grid grid-cols-2 gap-3" id="reg-student-fields">
        <div>
          <label
            class="block text-xs text-gray-400 font-semibold mb-1"
            for="reg-roll"
            >Roll Number *</label
          >
          <input
            id="reg-roll"
            type="text"
            placeholder="2026ME078"
            class="w-full px-4 py-2.5 rounded-xl bg-navy-800/90 border border-white/10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition"
          />
        </div>
        <div>
          <label
            class="block text-xs text-gray-400 font-semibold mb-1"
            for="reg-dept"
            >Department</label
          >
          <input
            id="reg-dept"
            type="text"
            placeholder="Mechanical"
            class="w-full px-4 py-2.5 rounded-xl bg-navy-800/90 border border-white/10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition"
          />
        </div>
      </div>

      <div>
        <label
          class="block text-xs text-gray-400 font-semibold mb-1"
          for="reg-phone"
          >Phone Number</label
        >
        <input
          id="reg-phone"
          type="tel"
          placeholder="9876543210"
          class="w-full px-4 py-2.5 rounded-xl bg-navy-800/90 border border-white/10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <div>
        <label
          class="block text-xs text-gray-400 font-semibold mb-1"
          for="reg-password"
          >Create Password *</label
        >
        <input
          id="reg-password"
          type="password"
          placeholder="••••••••"
          required
          class="w-full px-4 py-2.5 rounded-xl bg-navy-800/90 border border-white/10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <button
        type="submit"
        class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-indigo-500 text-white font-bold text-sm shadow-xl shadow-emerald-500/25 hover:shadow-emerald-500/40 hover:scale-[1.01] active:scale-[0.99] transition-all"
      >
        Create Account & Login
      </button>

      <div class="text-center pt-2">
        <button
          type="button"
          onclick="toggleAuthMode('login')"
          class="text-xs text-gray-400 hover:text-white transition"
        >
          Already have an account?
          <span class="font-bold underline text-indigo-400">Sign In</span>
        </button>
      </div>
    </form>

    <!-- Trust Footer -->
    <div
      class="mt-6 pt-4 border-t border-white/5 flex items-center justify-center gap-2 text-[10px] text-gray-500 font-medium"
    >
      <span
        class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"
      ></span>
      <span>MySQL Backed Escrow Verification · Real-Time Campus Ledger</span>
    </div>
  </div>
</section>
